[project]
name = "racecoach"
version = "0.1.0"
description = "Distance-based lap coaching for Assetto Corsa and Assetto Corsa Competizione telemetry"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Abram" }]
dependencies = []

[project.scripts]
racecoach = "racecoach.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]
ui-test = ["playwright>=1.50"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/racecoach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "ui: browser-driven UI tests (not part of the default offline suite)",
]

[tool.uv]
default-groups = ["dev"]
